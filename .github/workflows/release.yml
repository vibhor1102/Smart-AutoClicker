name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag, for example v3.5.1-patched.10'
        required: true
        default: 'v3.5.1-patched.13'
      release_name:
        description: 'Public release name'
        required: true
        default: 'Klickr Patched v3.5.1-patched.13'
      release_notes:
        description: 'Release notes'
        required: true
        default: 'Signed F-Droid release build for the maintained patched fork.'
      draft:
        description: 'Create release as draft'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish public fork release
    runs-on: ubuntu-latest

    steps:
    - name: Require main branch
      if: github.ref_name != 'main'
      shell: bash
      run: |
        echo "Releases for this fork must be dispatched from main; got '${{ github.ref_name }}'." >&2
        exit 1

    - name: Checkout release source
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set NDK
      shell: bash
      run: |
        echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Install ccache
      run: sudo apt-get install -y ccache

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-ccache-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref_name }}-
          ${{ runner.os }}-ccache-

    - name: Restore keystore
      shell: bash
      run: |
        printf '%s' "${{ secrets.RELEASE_KEYSTORE }}" > smartautoclicker.jks.asc
        gpg --batch --yes --pinentry-mode loopback \
          --passphrase "${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}" \
          --decrypt --output smartautoclicker/smartautoclicker.jks \
          smartautoclicker.jks.asc

    - name: Validate keystore secrets
      shell: bash
      run: |
        keytool -list \
          -keystore smartautoclicker/smartautoclicker.jks \
          -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
          -alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
          >/dev/null

    - name: Build with Gradle
      shell: bash
      env:
        USE_CCACHE: "true"
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      run: |
        ccache -M 500M
        ./gradlew --no-daemon --max-workers=4 --parallel --build-cache \
          -PsigningStorePassword="${{ secrets.SIGNING_STORE_PASSWORD }}" \
          -PsigningKeyAlias="${{ secrets.SIGNING_KEY_ALIAS }}" \
          -PsigningKeyPassword="${{ secrets.SIGNING_KEY_PASSWORD }}" \
          :smartautoclicker:assembleFDroidRelease
        ccache -s

    - name: Verify release APK
      shell: bash
      run: |
        APK="smartautoclicker/build/outputs/apk/fDroid/release/smartautoclicker-fDroid-release.apk"
        AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt2"
        APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"

        "$AAPT2" dump badging "$APK" | tee badging.txt
        grep -q "name='com.buzbuz.smartautoclicker.patched'" badging.txt
        ! grep -q "application-debuggable" badging.txt
        "$APKSIGNER" verify --verbose --print-certs "$APK"

    - name: Create public GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag_name }}
        target_commitish: ${{ github.sha }}
        name: ${{ inputs.release_name }}
        body: ${{ inputs.release_notes }}
        draft: ${{ inputs.draft }}
        prerelease: false
        fail_on_unmatched_files: true
        files: |
          smartautoclicker/build/outputs/apk/fDroid/release/smartautoclicker-fDroid-release.apk

    - name: Upload workflow artifacts
      uses: actions/upload-artifact@v4
      with:
        name: smartautoclicker-fdroid-release
        path: |
          smartautoclicker/build/outputs/apk/fDroid/release/smartautoclicker-fDroid-release.apk
