name: Debug APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Native ABI to package
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
          - all
      publish_release:
        description: Publish an internal testing prerelease
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  debug-apk:
    name: Build patched debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Set NDK
      shell: bash
      run: |
        echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Cache debug keystore
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: ${{ runner.os }}-android-debug-keystore-${{ github.repository_id }}

    - name: Install ccache
      run: sudo apt-get install -y ccache

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-debug-ccache-${{ inputs.abi }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-debug-ccache-${{ inputs.abi }}-
          ${{ runner.os }}-debug-ccache-

    - name: Build debug APK
      shell: bash
      env:
        USE_CCACHE: "true"
        CCACHE_DIR: ${{ github.workspace }}/.ccache
      run: |
        ccache -M 500M

        ABI_ARGS=()
        if [ "${{ inputs.abi }}" != "all" ]; then
          ABI_ARGS+=("-PklickrDebugAbi=${{ inputs.abi }}")
        fi

        ./gradlew --no-daemon --max-workers=4 --parallel --build-cache \
          "${ABI_ARGS[@]}" \
          :smartautoclicker:assembleFDroidDebug
        ccache -s

    - name: Verify debug APK
      shell: bash
      run: |
        AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt2"
        APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"

        if [ "${{ inputs.abi }}" = "all" ]; then
          mapfile -t APKS < <(find smartautoclicker/build/outputs/apk/fDroid/debug -name '*.apk' | sort)
        else
          mapfile -t APKS < <(find smartautoclicker/build/outputs/apk/fDroid/debug -name "*${{ inputs.abi }}*.apk" | sort)
        fi
        test "${#APKS[@]}" -gt 0

        : > debug-badging.txt
        : > apk-files.txt
        : > debug-signing-certs.txt
        for APK in "${APKS[@]}"; do
          echo "== $APK ==" | tee -a debug-badging.txt
          "$AAPT2" dump badging "$APK" | tee current-debug-badging.txt | tee -a debug-badging.txt
          grep -q -E "name='com.buzbuz.smartautoclicker(\.patched)?\.debug'" current-debug-badging.txt
          grep -q "application-debuggable" current-debug-badging.txt
          echo "== $APK ==" | tee -a debug-signing-certs.txt
          "$APKSIGNER" verify --print-certs "$APK" | tee -a debug-signing-certs.txt
          unzip -l "$APK" | tee -a apk-files.txt
        done

        if [ "${{ inputs.abi }}" != "all" ]; then
          grep -q "lib/${{ inputs.abi }}/libsmartautoclicker.so" apk-files.txt
        fi

    - name: Collect debug artifacts
      shell: bash
      run: |
        mkdir -p debug-apk-artifacts internal-release-assets
        cp debug-badging.txt debug-signing-certs.txt apk-files.txt debug-apk-artifacts/

        if [ "${{ inputs.abi }}" = "all" ]; then
          mapfile -t UPLOAD_APKS < <(find smartautoclicker/build/outputs/apk/fDroid/debug -name '*.apk' | sort)
          test "${#UPLOAD_APKS[@]}" -gt 0
          cp "${UPLOAD_APKS[@]}" debug-apk-artifacts/
        else
          mapfile -t SELECTED_APKS < <(find smartautoclicker/build/outputs/apk/fDroid/debug -name "*${{ inputs.abi }}*.apk" | sort)
          test "${#SELECTED_APKS[@]}" -eq 1

          RENAMED_APK="klickr-debug-${{ inputs.abi }}.apk"
          cp "${SELECTED_APKS[0]}" "debug-apk-artifacts/$RENAMED_APK"
          cp "${SELECTED_APKS[0]}" "internal-release-assets/$RENAMED_APK"
        fi

    - name: Validate internal release inputs
      if: ${{ inputs.publish_release && inputs.abi == 'all' }}
      shell: bash
      run: |
        echo "Internal debug releases require a single ABI. Select arm64-v8a, armeabi-v7a, x86_64, or x86."
        exit 1

    - name: Publish internal debug release
      if: ${{ inputs.publish_release && inputs.abi != 'all' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        BRANCH_NAME="${GITHUB_REF_NAME}"
        SHORT_SHA="${GITHUB_SHA::7}"
        SAFE_BRANCH="$(echo "$BRANCH_NAME" | tr -c 'A-Za-z0-9._-' '-')"
        TAG_NAME="internal-debug-${SAFE_BRANCH}-${SHORT_SHA}"
        TITLE="INTERNAL DEBUG APK - ${BRANCH_NAME} - ${SHORT_SHA}"
        ASSET="internal-release-assets/klickr-debug-${{ inputs.abi }}.apk"

        cat > release-body.md <<EOF
        This is a debuggable internal debug build for targeted testing only.

        It is not a general-use release and should not be shared as a normal Klick'r / Smart AutoClicker build.

        Package: com.buzbuz.smartautoclicker.debug
        ABI: ${{ inputs.abi }}
        Branch: ${BRANCH_NAME}
        Commit: ${GITHUB_SHA}
        EOF

        gh release delete "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

        LATEST_ARGS=()
        if gh release create --help | grep -q -- '--latest'; then
          LATEST_ARGS+=(--latest=false)
        fi

        gh release create "$TAG_NAME" "$ASSET" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "$TITLE" \
          --notes-file release-body.md \
          --prerelease \
          "${LATEST_ARGS[@]}"

    - name: Create or Update Persistent GitHub Release
      if: ${{ inputs.publish_release }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="debug-apk-latest"
        
        # Ensure the release exists (it will do nothing/succeed if it already exists)
        gh release create "$TAG_NAME" \
          --title "Latest Debug APKs" \
          --notes "This is a persistent release containing the latest debug APK builds." \
          --prerelease \
          || true
          
        # Update release metadata
        gh release edit "$TAG_NAME" \
          --title "Latest Debug APKs" \
          --notes "Latest debug APK build from branch **${{ github.ref_name }}** (commit \`${{ github.sha }}\`)."
          
        # Upload the new APKs, overwriting any existing assets with the same name
        gh release upload "$TAG_NAME" \
          smartautoclicker/build/outputs/apk/fDroid/debug/*.apk \
          --clobber

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: smartautoclicker-patched-debug-${{ inputs.abi }}-apk
        retention-days: 14
        path: |
          debug-apk-artifacts/*

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Set NDK
      shell: bash
      run: |
        echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Run unit tests
      shell: bash
      run: |
        ./gradlew --no-daemon --max-workers=4 --parallel --build-cache \
          testFDroidDebugUnitTest
