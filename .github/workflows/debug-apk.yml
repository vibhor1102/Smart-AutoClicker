name: Debug APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Native ABI to package
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
          - all

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build patched debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Set NDK
      shell: bash
      run: |
        echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Cache debug keystore
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: ${{ runner.os }}-android-debug-keystore-${{ github.repository_id }}

    - name: Install ccache
      run: sudo apt-get install -y ccache

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ${{ runner.os }}-debug-ccache-${{ inputs.abi }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-debug-ccache-${{ inputs.abi }}-
          ${{ runner.os }}-debug-ccache-

    - name: Build debug APK
      shell: bash
      env:
        USE_CCACHE: "true"
        CCACHE_DIR: ${{ github.workspace }}/.ccache
      run: |
        ccache -M 500M

        ABI_ARGS=()
        if [ "${{ inputs.abi }}" != "all" ]; then
          ABI_ARGS+=("-PklickrDebugAbi=${{ inputs.abi }}")
        fi

        ./gradlew --no-daemon --max-workers=4 --parallel --build-cache \
          "${ABI_ARGS[@]}" \
          :smartautoclicker:assembleFDroidDebug
        ccache -s

    - name: Verify debug APK
      shell: bash
      run: |
        AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt2"
        APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"

        if [ "${{ inputs.abi }}" = "all" ]; then
          mapfile -t APKS < <(find smartautoclicker/build/outputs/apk/fDroid/debug -name '*.apk' | sort)
        else
          mapfile -t APKS < <(find smartautoclicker/build/outputs/apk/fDroid/debug -name "*${{ inputs.abi }}*.apk" | sort)
        fi
        test "${#APKS[@]}" -gt 0

        : > debug-badging.txt
        : > apk-files.txt
        : > debug-signing-certs.txt
        for APK in "${APKS[@]}"; do
          echo "== $APK ==" | tee -a debug-badging.txt
          "$AAPT2" dump badging "$APK" | tee current-debug-badging.txt | tee -a debug-badging.txt
          grep -q -E "name='com.buzbuz.smartautoclicker(\.patched)?\.debug'" current-debug-badging.txt
          grep -q "application-debuggable" current-debug-badging.txt
          echo "== $APK ==" | tee -a debug-signing-certs.txt
          "$APKSIGNER" verify --print-certs "$APK" | tee -a debug-signing-certs.txt
          unzip -l "$APK" | tee -a apk-files.txt
        done

        if [ "${{ inputs.abi }}" != "all" ]; then
          grep -q "lib/${{ inputs.abi }}/libsmartautoclicker.so" apk-files.txt
        fi

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: smartautoclicker-patched-debug-${{ inputs.abi }}-apk
        retention-days: 14
        path: |
          smartautoclicker/build/outputs/apk/fDroid/debug/*.apk
          debug-badging.txt
          debug-signing-certs.txt
          apk-files.txt

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Set NDK
      shell: bash
      run: |
        echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Run unit tests
      shell: bash
      run: |
        ./gradlew --no-daemon --max-workers=4 --parallel --build-cache \
          testFDroidDebugUnitTest
