name: Verify Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify compilation and tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Set NDK
      shell: bash
      run: |
        echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Compile
      shell: bash
      run: |
        ./gradlew --no-daemon --max-workers=4 --parallel --build-cache \
          :smartautoclicker:compileFDroidDebugKotlin

    - name: Run unit tests
      shell: bash
      run: |
        ./gradlew --no-daemon --max-workers=4 --parallel --build-cache \
          testFDroidDebugUnitTest
